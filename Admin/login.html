<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập Admin</title>
    <link rel="icon" href="https://img.icons8.com/external-smashingstocks-flat-smashing-stocks/66/external-Billiard-Ball-casino-smashingstocks-flat-smashing-stocks.png" />
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="login-page">
    
    <div class="login-container">
      <h2>Đăng nhập Admin</h2>
      <form id="login-form">
  <div class="form-group">
    <label for="email">Email:</label>
    <input
      type="email"
      id="login-email" placeholder="admin@example.com"
      required
    />
  </div>
  <div class="form-group">
    <label for="password">Mật khẩu:</label>
    <input
      type="password"
      id="login-password" placeholder="********"
      required
    />
  </div>
  <button type="submit" class="btn btn-primary">Đăng nhập</button>
</form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="../app.js"></script>
    <script src="../login.js"></script>
  </body>
</html>
